name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # пробная сборка без публикации

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Версия тега = APP_VERSION
        shell: pwsh
        run: |
          $v = (Select-String -Path wheel_launcher.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ("${{ github.event_name }}" -eq "push" -and "v$v" -ne "${{ github.ref_name }}") { throw "Тег ${{ github.ref_name }} не совпадает с APP_VERSION $v" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Сборка программы
        shell: pwsh
        run: |
          # setup.py у vgamepad запускает интерактивный msiexec (драйвер ViGEmBus) и вешает сборку — вырезаем этот вызов
          Invoke-WebRequest "https://files.pythonhosted.org/packages/8a/54/0eaddc33f84247963af078f364b37153d09fcd6cdc398f243ec3e8842c56/vgamepad-0.1.0.tar.gz" -OutFile vgamepad.tar.gz
          tar -xzf vgamepad.tar.gz
          (Get-Content vgamepad-0.1.0/setup.py) -replace "subprocess\.call\(\['msiexec'.*$", "pass" | Set-Content vgamepad-0.1.0/setup.py
          pip install pyinstaller==6.16.0 pygame==2.6.1 ./vgamepad-0.1.0
          python -m PyInstaller --noconfirm --clean --windowed --onedir --noupx `
            --name "Wheel Launcher" --icon "$PWD\wheel_launcher.ico" --add-data "$PWD\wheel_launcher.ico;." `
            --collect-all vgamepad --exclude-module pytest `
            --distpath dist --workpath build/work --specpath build/work `
            wheel_launcher.py

      - name: Установщик
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" build\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Релиз
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/Wheel_Launcher_Setup_$env:VERSION.exe" --title "Wheel Launcher $env:VERSION" --generate-notes
